name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Pinned rather than "latest": a staticcheck release that predates the
      # toolchain refuses to run, so this version moves deliberately alongside
      # the Go version in go.mod.
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2025.1.1"
          install-go: false

      - name: build
        run: go build ./...

      - name: test (race)
        run: go test -race -count=1 ./...

      # The integration tests are tag-gated, so a plain `go test` never compiles
      # them. Type-check them here so they can't silently rot between the
      # (slower) integration runs.
      - name: type-check integration tests
        run: go vet -tags integration ./...

  integration:
    name: Integration (MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Started here rather than as a `services:` container: the MinIO image
      # needs the `server /data` argument, which the services block cannot
      # supply.
      #
      # MinIO archived its open-source server in 2025. quay.io/minio/minio
      # stopped granting anonymous pulls — the pull now fails with
      # "unauthorized", which is what broke this job — the Docker Hub
      # repository is gone, and dl.min.io answers 410 for the community
      # binaries. This is the Alpine project's rebuild of the FINAL community
      # release, pinned to that exact upstream tag.
      #
      # Staying on MinIO matters more than staying current: several of this
      # project's documented limitations are statements about how MinIO
      # behaves, and a different server would answer differently and quietly
      # stop checking them.
      #
      # The tmpfs is not an optimisation. This image runs as a non-root user,
      # so a /data created in the container's own layer is root-owned and the
      # server dies with "Unable to initialize backend: file access denied".
      # Mounting it with that user's ids settles the ownership, and a run that
      # starts from nothing is what makes the suite's fixtures trustworthy.
      - name: start MinIO
        env:
          MINIO_IMAGE: alpine/minio:RELEASE.2025-10-15T17-29-55Z
        run: |
          docker run -d --name minio -p 9000:9000 \
            --tmpfs /data:uid=100,gid=101,mode=0750 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            "$MINIO_IMAGE" server /data --address :9000
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO is up"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready in time" >&2
          docker logs minio || true
          exit 1

      - name: integration tests
        env:
          S3DUCK_TEST_ENDPOINT: http://localhost:9000
          S3DUCK_TEST_ACCESS_KEY: minioadmin
          S3DUCK_TEST_SECRET_KEY: minioadmin
          S3DUCK_TEST_REGION: us-east-1
        run: go test -tags integration -count=1 -v ./...

      # `|| true`: when the failure IS that the container never started — an
      # unauthorized pull, say — `docker logs` exits 1 and adds a second,
      # louder error that buries the real one.
      - name: MinIO logs on failure
        if: failure()
        run: docker logs minio || true

  cross-build:
    name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The platforms the Makefile ships binaries for. CGO is off so these
          # cross-compile without a per-target toolchain.
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 } # uConsole CM4, Pi Zero 2 W (64-bit)
          - { goos: linux, goarch: arm, goarm: "7" } # Pi Zero 2 W (32-bit)
          - { goos: linux, goarch: riscv64 } # LicheeRV Nano (W)
          - { goos: freebsd, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/s3duck-tui
